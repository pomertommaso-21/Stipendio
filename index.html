<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Quote">
<meta name="theme-color" content="#F2F3F5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A0C0F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Quote stipendio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&display=swap">
<style>
/* Layout: sul telefono una colonna (riquadro "Oggi", entrate, poi la sezione scelta) con barra in basso e "+" centrale; da 960px riepilogo fisso a sinistra e sezioni a destra. Ogni modifica avviene in un pannello. */
:root{
  --bg:#F2F3F5; --surface:#FFFFFF; --sunk:#EEF0F3; --hover:#F6F7F9; --ink:#0D1117; --ink2:#394150; --muted:#6B7280; --line:#E3E6EB; --hair:#EDEFF2; --scrim:rgb(13 17 23/.34);
  --spend:#0E7A5A; --spend-bg:#E7F2EC; --good:#0E7A5A; --warn:#946400; --crit:#C0392B; --crit-bg:#FBECE9;
  --hero-bg:#0E1116; --hero-fg:#F3F4F6; --hero-muted:#9099A8; --hero-line:rgb(255 255 255/.10); --hero-accent:#5FD3A8; --hero-crit:#FF8A73; --hero-border:transparent;
  --b1:#3E5C76; --b2:#A9832F; --b3:#B5654A; --b4:#4F7A65; --b5:#7A5C8E; --b6:#2F7F88; --b7:#A45A78; --b8:#6B6F3A;
  --f-ui:"Geist",-apple-system,"SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0C0F; --surface:#13161B; --sunk:#1B1F25; --hover:#181C22; --ink:#ECEEF2; --ink2:#C3C8D1; --muted:#8A93A3; --line:#242932; --hair:#1E2229; --scrim:rgb(0 0 0/.6);
  --spend:#4CC79A; --spend-bg:#0F241C; --good:#4CC79A; --warn:#E2B04E; --crit:#F0806B; --crit-bg:#2A1613;
  --hero-bg:#171B21; --hero-fg:#F3F4F6; --hero-muted:#8D96A6; --hero-line:rgb(255 255 255/.09); --hero-accent:#5FD3A8; --hero-crit:#FF8A73; --hero-border:#262B33;
  --b1:#86A6C6; --b2:#D6B26A; --b3:#DE8F73; --b4:#85B39C; --b5:#B395C9; --b6:#6FBAC3; --b7:#D38BA9; --b8:#ABB06C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0C0F; --surface:#13161B; --sunk:#1B1F25; --hover:#181C22; --ink:#ECEEF2; --ink2:#C3C8D1; --muted:#8A93A3; --line:#242932; --hair:#1E2229; --scrim:rgb(0 0 0/.6);
  --spend:#4CC79A; --spend-bg:#0F241C; --good:#4CC79A; --warn:#E2B04E; --crit:#F0806B; --crit-bg:#2A1613;
  --hero-bg:#171B21; --hero-fg:#F3F4F6; --hero-muted:#8D96A6; --hero-line:rgb(255 255 255/.09); --hero-accent:#5FD3A8; --hero-crit:#FF8A73; --hero-border:#262B33;
  --b1:#86A6C6; --b2:#D6B26A; --b3:#DE8F73; --b4:#85B39C; --b5:#B395C9; --b6:#6FBAC3; --b7:#D38BA9; --b8:#ABB06C; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;letter-spacing:-.005em;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 160px;
  font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:8px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:16px;height:16px;stroke-width:1.9}

.shell{max-width:1120px;margin:0 auto;display:grid;gap:28px}
@media (min-width:960px){
  body{padding-block:40px 64px}
  .shell{grid-template-columns:380px minmax(0,1fr);gap:56px;align-items:start}
  .summary{position:sticky;top:calc(40px + env(safe-area-inset-top,0px))}
}

/* testata */
.summary{display:flex;flex-direction:column;gap:14px;min-width:0}
.brandrow{display:flex;justify-content:space-between;align-items:center;min-height:40px;margin-bottom:6px}
.wordmark{display:flex;align-items:center;gap:10px;font-weight:600;font-size:17px;letter-spacing:-.02em}
.wordmark svg{width:22px;height:22px;fill:var(--ink)}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--hover)}
.brandrow .iconbtn{display:none}
@media (min-width:960px){.brandrow .iconbtn{display:grid}}

/* riquadro Oggi */
.hero{background:var(--hero-bg);color:var(--hero-fg);border:1px solid var(--hero-border);border-radius:28px;padding:22px 22px 20px;display:flex;flex-direction:column}
.h-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;color:var(--hero-muted)}
.h-pill{font-size:12px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--hero-line);color:var(--hero-fg);white-space:nowrap}
.h-val{font-size:clamp(62px,18vw,86px);font-weight:300;letter-spacing:-.055em;line-height:1.02;margin-top:10px;display:flex;align-items:baseline;gap:8px}
.h-val small{font-size:30px;color:var(--hero-muted);letter-spacing:-.02em}
.h-val.neg{color:var(--hero-crit)}
.h-sub{font-size:13.5px;color:var(--hero-muted);margin-top:4px;text-wrap:pretty}
.h-sub b{color:var(--hero-fg);font-weight:500}
.h-note{font-size:12.5px;color:var(--hero-muted);margin-top:6px;opacity:.85}
.h-track{position:relative;height:6px;border-radius:99px;background:var(--hero-line);margin:20px 0 0}
.h-track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--hero-accent);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.h-track i.over{background:var(--hero-crit)}
.h-track b{position:absolute;top:-5px;bottom:-5px;width:2px;border-radius:2px;background:var(--hero-fg)}
.h-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.h-stats div{display:flex;flex-direction:column;min-width:0}
.h-stats small{font-size:12px;color:var(--hero-muted)}
.h-stats span{font-size:17px;font-weight:500;letter-spacing:-.02em}
.h-stats span.neg{color:var(--hero-crit)}

.offer{display:grid;grid-template-columns:36px minmax(0,1fr);gap:14px;align-items:start;background:var(--spend-bg);border-radius:22px;padding:16px;animation:drop .3s ease}
.o-ic{width:36px;height:36px;border-radius:12px;background:var(--spend);color:var(--surface);display:grid;place-items:center}
.o-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.o-tx b{font-size:15.5px;font-weight:600}
.o-tx span{font-size:13.5px;color:var(--ink2);text-wrap:pretty}
.o-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.xlist{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.xrow{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;gap:12px;align-items:center;min-height:56px;border-bottom:1px solid var(--line);font-size:15px}
.xn{display:flex;flex-direction:column;min-width:0}
.xn small{font-size:12.5px;color:var(--muted)}
.xa{font-weight:500;color:var(--spend);text-align:right}
.x{border:0;background:none;color:var(--muted);width:34px;height:34px;border-radius:10px;display:grid;place-items:center}
.x:hover{background:var(--sunk);color:var(--ink)}
.x.arm{background:var(--crit);color:#fff;width:auto;padding:0 10px;font-size:12.5px;font-weight:600;justify-self:end}
.mcard{border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
.mhead{display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500}
.switch{width:48px;height:30px;border-radius:99px;border:0;background:var(--line);position:relative;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgb(0 0 0/.2);transition:left .2s}
.switch[aria-pressed="true"]{background:var(--spend)} .switch[aria-pressed="true"]::after{left:21px}
/* blocco mese */
.month{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:2px 18px 16px;display:flex;flex-direction:column}
.stoggle{display:grid;grid-template-columns:minmax(0,1fr) auto 16px;gap:10px;align-items:center;min-height:58px;border:0;border-bottom:1px solid var(--hair);background:none;width:100%;text-align:left;padding:6px 0}
.stoggle .sl{display:flex;flex-direction:column;min-width:0}
.stoggle .sl span{font-size:14.5px;color:var(--ink2)}
.stoggle .sl small{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stoggle .sl small em{font-style:normal;color:var(--spend)}
.ssum{font-weight:600;font-size:17px;letter-spacing:-.02em}
.schev{display:grid;place-items:center;color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.month.open .schev{transform:rotate(-90deg)}
.srows{display:flex;flex-direction:column;animation:drop .2s ease}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:48px;padding:0 0 0 12px;border:0;border-bottom:1px solid var(--hair);background:none;width:100%;text-align:left;font-size:14.5px;color:var(--ink2);cursor:pointer}
.sval{display:inline-flex;align-items:baseline;gap:4px;font-weight:500;color:var(--ink);font-size:15.5px}
.sval input{border:0;border-bottom:1px solid transparent;background:none;padding:2px 0;text-align:right;font-weight:500;font-size:16px;min-width:3ch;max-width:9ch}
.sval input:hover{border-bottom-color:var(--line)} .sval input:focus{outline:none;border-bottom-color:var(--ink)}
.sval span{color:var(--muted);font-weight:400}
.sval.cash{color:var(--spend)}
.sadd{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:500;font-size:14px}
button.srow:hover .sadd{color:var(--ink)}
.mrow{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:46px;border-bottom:1px solid var(--hair);font-size:14.5px;color:var(--ink2)}
.mrow b{font-weight:500;color:var(--ink);font-size:15.5px}
.mrow.sp{border-bottom:0} .mrow.sp b{color:var(--spend);font-weight:600} .mrow.sp.neg b{color:var(--crit)}
.alloc{display:flex;gap:3px;height:6px;border-radius:99px;overflow:hidden;background:var(--sunk);margin-top:4px}
.alloc i{display:block;height:100%;border-radius:2px}
.alloc i.fr{background:repeating-linear-gradient(135deg,var(--spend) 0 1.5px,transparent 1.5px 4.5px);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--spend) 50%,transparent)}
.legend{display:none;flex-direction:column;margin-top:10px}
.legend div{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;color:var(--muted)}
.legend dt{display:flex;align-items:center;gap:9px;min-width:0}
.legend dt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend dt i{width:7px;height:7px;border-radius:50%;flex:none}
.legend dd{margin:0;color:var(--ink);font-weight:500}
@media (min-width:960px){.legend{display:flex}}

/* colonna principale */
.main{display:flex;flex-direction:column;gap:14px;min-width:0;scroll-margin-top:72px}
.mainhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:2px;min-height:40px}
.mainhead h2{margin:0;font-size:26px;font-weight:600;letter-spacing:-.035em}
.tabs{display:none;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
.tabs button{border:0;background:none;padding:7px 16px;border-radius:9px;font-weight:500;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.06),0 0 0 1px var(--line)}
@media (min-width:960px){.mainhead h2{display:none}.tabs{display:inline-flex}}
.mainhead .only-desk{display:none}
@media (min-width:960px){.mainhead .only-desk{display:inline-flex}}

.btn{border:0;background:var(--ink);color:var(--bg);border-radius:12px;height:46px;padding:0 18px;font-weight:600;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{opacity:.9}
.btn.wide{width:100%;height:52px;border-radius:14px;font-size:16px}
.btn2{border:1px solid var(--line);background:var(--surface);border-radius:12px;height:46px;padding:0 16px;font-weight:500;font-size:14.5px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn2:hover{background:var(--hover)}
.btn.sm,.btn2.sm{height:38px;padding:0 13px;font-size:14px;border-radius:11px}
.btn-danger{border:0;background:none;color:var(--crit);font-weight:500;font-size:14.5px;padding:10px 4px;border-radius:10px}
.btn-danger.arm{background:var(--crit);color:#fff;padding:10px 14px}

.notice{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border:1px dashed var(--line);border-radius:18px;padding:12px 14px 12px 16px;font-size:13.5px;color:var(--muted)}
.notice b{color:var(--ink);font-weight:600}
.notice .nb{display:flex;gap:8px}

/* movimenti */
.period{font-size:13.5px;color:var(--muted);margin:-4px 0 4px}
.period b{color:var(--ink);font-weight:500}
.day{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:6px 8px}
.dgroup+.dgroup{border-top:1px solid var(--line);margin-top:4px;padding-top:4px}
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:10px 12px 4px;font-size:13px;color:var(--muted);font-weight:500}
.dayh b{font-weight:500;color:var(--ink2)}
.mv{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;min-height:56px;padding:0 12px;width:100%;text-align:left;border:0;background:none;border-radius:14px;position:relative}
.dayh+.mv::before{display:none}
.mv:not(:first-of-type)::before{content:"";position:absolute;left:60px;right:12px;top:0;border-top:1px solid var(--hair)}
.mv:hover{background:var(--hover)} .mv:hover::before,.mv:hover+.mv::before{opacity:0}
.mvi{width:36px;height:36px;border-radius:11px;background:var(--sunk);color:var(--ink2);display:grid;place-items:center;font-weight:600;font-size:14px}
.mvi.cash{background:var(--spend-bg);color:var(--spend)}
.mvn{display:flex;flex-direction:column;min-width:0}
.mvn span{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mvn small{font-size:12.5px;color:var(--muted)}
.mva{font-size:15.5px;font-weight:500}
.mva.cash{color:var(--spend)}

/* conto */
.acct{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.acct-head{display:grid;grid-template-columns:42px minmax(0,1fr) auto 16px;gap:14px;align-items:center;padding:18px 20px 16px;width:100%;text-align:left;border:0;background:none}
.acct-head:hover{background:var(--hover)}
.ico{width:42px;height:42px;border-radius:13px;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);display:grid;place-items:center}
.who{display:flex;flex-direction:column;min-width:0}
.an{font-size:16.5px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ak{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at{display:flex;flex-direction:column;align-items:flex-end}
.at b{font-size:21px;font-weight:500;letter-spacing:-.03em;line-height:1.2}
.at small{font-size:12.5px;color:var(--muted);white-space:nowrap}
.achev{display:grid;place-items:center;color:var(--muted);transform:rotate(90deg);transition:transform .2s}
.acct.open .achev{transform:rotate(-90deg)}
.vbar{display:flex;gap:2px;height:4px;margin:0 20px 18px;border-radius:99px;overflow:hidden;background:var(--sunk)}
.vbar i{display:block;background:var(--c)}
.acct.open .vbar{margin-bottom:6px}
.adrop{animation:drop .2s ease}
.anote{margin:0;padding:2px 20px 14px;font-size:13.5px;color:var(--muted)}
.rows{display:flex;flex-direction:column;padding:0 8px}
.row{display:grid;grid-template-columns:8px minmax(0,1fr) auto auto;gap:12px;align-items:center;min-height:50px;padding:0 12px;width:100%;text-align:left;border:0;background:none;border-radius:12px;position:relative}
.row:not(:first-child)::before{content:"";position:absolute;left:32px;right:12px;top:0;border-top:1px solid var(--hair)}
.row:hover{background:var(--hover)} .row:hover::before,.row:hover+.row::before{opacity:0}
.row .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.rn{font-size:15px;display:flex;align-items:center;gap:8px;min-width:0}
.rn>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn.empty{color:var(--muted)}
.rm{font-size:12px;color:var(--muted);background:var(--sunk);padding:2px 7px;border-radius:6px}
.rm:empty{display:none}
.ra{font-size:15px;font-weight:500;min-width:4.5em;text-align:right}
.tag{font-size:11px;font-weight:500;color:var(--muted);border:1px solid var(--line);padding:1px 6px;border-radius:6px;flex:none}
.afoot{display:flex;border-top:1px solid var(--hair);margin-top:6px}
.acct.nocats .afoot{margin-top:0}
.addrow{display:flex;align-items:center;gap:8px;flex:1;border:0;background:none;padding:14px 20px;font-size:14px;font-weight:500;color:var(--muted);text-align:left}
.addrow:hover{color:var(--ink);background:var(--hover)}
.addrow.edit{justify-content:flex-end}

/* obiettivo */
.goal{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:8px;display:flex;flex-direction:column;gap:4px}
.goal-top{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px;border:0;background:none;border-radius:16px;width:100%;text-align:left}
.goal-top:hover{background:var(--hover)}
.ringw{position:relative;width:56px;height:56px}
.ringw svg{width:56px;height:56px;display:block}
.ringw span{position:absolute;inset:0;display:grid;place-items:center;font-size:12.5px;font-weight:600}
.gn{font-size:17px;font-weight:600;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gd{font-size:13px;color:var(--muted)}
.gline{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;color:var(--muted);padding:0 14px 10px}
.gline b{color:var(--ink);font-weight:500}
.chev{color:var(--muted)}
.plan{background:var(--sunk);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ptop{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.plan .lbl{display:block;font-size:13px;color:var(--muted)}
.plan .val{font-size:34px;font-weight:400;letter-spacing:-.045em;line-height:1.1}
.plan .val small{font-size:15px;color:var(--muted);letter-spacing:-.01em;font-weight:400}
.plan p{margin:0;font-size:13.5px;color:var(--ink2);text-wrap:pretty}
.plan p b{font-weight:600;color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;font-size:12.5px;font-weight:500;background:var(--surface);border:1px solid var(--line)}
.chip i{width:7px;height:7px;border-radius:50%;background:currentColor}
.chip.good{color:var(--good)} .chip.warn{color:var(--warn)} .chip.crit{color:var(--crit)}
.split{display:flex;flex-direction:column;border-top:1px solid var(--line)}

<script>
(() => {
const KEY = 'quote-stipendio-v2', OLDKEY = 'quote-stipendio-v1';
const eur = new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR',maximumFractionDigits:0});

const pnum = new Intl.NumberFormat('it-IT',{maximumFractionDigits:1});
const uid = () => Math.random().toString(36).slice(2,9);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sum = (a,f) => a.reduce((t,x)=>t+(f?f(x):x),0);
const round1 = v => Math.round(v*10)/10;
const now = new Date();
const curKey = now.getFullYear()*12+now.getMonth();
const isoDay = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const TODAY = isoDay(now);
const ymAhead = n => { const d = new Date(now.getFullYear(), now.getMonth()+n, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); };
const monthName = k => new Intl.DateTimeFormat('it-IT',{month:'long',year:'numeric'}).format(new Date(Math.floor(k/12), k%12, 1));
const COLORS = 8;

const ICONS = {
  corrente:'<rect x="3" y="6" width="18" height="12" rx="2.5"/><path d="M3 10h18M7 14.5h3"/>',
  risparmio:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M10 12.5h4M9 8V5h6v3"/>',
  investimenti:'<path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/>',
  digitale:'<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 17.5h2"/>',
  contanti:'<rect x="2.5" y="7" width="19" height="10" rx="2"/><circle cx="12" cy="12" r="2.4"/><path d="M6 10v4M18 10v4"/>',
  cointestato:'<circle cx="9" cy="9" r="3"/><circle cx="16.5" cy="10" r="2.4"/><path d="M3.5 19c.4-3 2.7-4.8 5.5-4.8s5.1 1.8 5.5 4.8M15.5 14.6c2.6 0 4.5 1.5 5 4.4"/>',
  salvadanaio:'<path d="M5 11a7 6 0 0 1 13-2h2v4l-2 1-1 3h-2.5l-.5-1.5h-4L9.5 17H7l-.6-2.4A6 6 0 0 1 5 11z"/><path d="M10 7.5h3"/>',
  altro:'<path d="M12 3.5l2.5 5.3 5.8.7-4.3 4 1.1 5.8L12 16.5l-5.1 2.8 1.1-5.8-4.3-4 5.8-.7z"/>'
};
const UI = {
  plus:'<path d="M12 5v14M5 12h14"/>',
  movimenti:'<path d="M4 7h16M4 12h16M4 17h10"/>',
  conti:'<rect x="3" y="5.5" width="18" height="13" rx="3"/><path d="M3 9.5h18M15.5 14.5h2.5"/>',
  obiettivi:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/>',
  opzioni:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  close:'<path d="M7 7l10 10M17 7L7 17"/>',
  chev:'<path d="M10 7l5 5-5 5"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  edit:'<path d="M4.5 19.5h4l10-10-4-4-10 10z"/><path d="M13 7l4 4"/>'
};
const KINDS = [['corrente','Corrente'],['risparmio','Risparmio'],['investimenti','Investimenti'],['digitale','Digitale'],['cointestato','Cointestato'],['salvadanaio','Salvadanaio'],['contanti','Contanti'],['altro','Altro']];
const KIND_FULL = {corrente:'Conto corrente',risparmio:'Conto risparmio',investimenti:'Investimenti',digitale:'Conto digitale',cointestato:'Conto cointestato',salvadanaio:'Salvadanaio',contanti:'Contanti',altro:'Altro'};
const SPESA_CHIPS = ['Spesa','Caffè','Pranzo','Cena fuori','Benzina','Trasporti','Shopping','Svago'];
const CASH_CHIPS = ['Paghetta','Regalo','Rimborso','Mancia','Vendita'];
const icon = k => `<svg class="i" viewBox="0 0 24 24" aria-hidden="true">${ICONS[k]||ICONS.altro}</svg>`;
const ui_ = (k,cls='i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${UI[k]}</svg>`;
const MARK = '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="9" width="4.5" height="12" rx="2.25"/><rect x="9.75" y="3" width="4.5" height="18" rx="2.25"/><rect x="16.5" y="13" width="4.5" height="8" rx="2.25"/></svg>';

function parseNum(s){
  s = String(s).replace(/[€%\s+−-]/g,'');
  if (s === '') return 0;
  if (s.includes(',')) s = s.replace(/\./g,'').replace(',','.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g,'');
  const v = parseFloat(s);
  return isFinite(v) && v >= 0 ? v : null;
}

/* ---------- modelli ---------- */
const C = (name,mode,value,extra) => ({id:uid(),name,mode,value,...extra});
const TEMPLATES = [
  {id:'503020', name:'Regola 50 · 30 · 20', desc:'50% alle necessità, 20% al risparmio, il 30% resta come budget spendibile.', mini:[[50,1],[20,4],[30,0]],
   build:()=>[
    {id:uid(),name:'Spese essenziali',kind:'corrente',color:1,mode:'pct',value:50,cats:[C('Casa','pct',25),C('Spesa','pct',15),C('Trasporti','pct',10)]},
    {id:uid(),name:'Risparmio',kind:'risparmio',color:4,mode:'pct',value:20,cats:[C('Fondo emergenze','pct',12),C('Investimenti','pct',8)]}]},
  {id:'due', name:'Due conti', desc:'Spese fisse sul corrente, una quota al risparmio, il resto è da spendere.', mini:[[60,1],[15,4],[25,0]],
   build:()=>[
    {id:uid(),name:'Conto corrente',kind:'corrente',color:1,mode:'pct',value:60,cats:[]},
    {id:uid(),name:'Conto risparmio',kind:'risparmio',color:4,mode:'pct',value:15,cats:[]}]},
  {id:'buste', name:'Buste', desc:'Un solo conto con buste a importo fisso. Quello che avanza lo spendi.', mini:[[40,1],[20,2],[10,6],[30,0]],
   build:()=>[
    {id:uid(),name:'Conto principale',kind:'corrente',color:1,mode:'fixed',value:0,cats:[C('Affitto','fixed',600),C('Spesa','fixed',300),C('Bollette','fixed',120),C('Risparmio','pct',10)]}]},
  {id:'invest', name:'Paga prima te stesso', desc:'Investimenti e risparmio partono subito, vivi con quello che resta.', mini:[[15,2],[10,4],[75,0]],
   build:()=>[
    {id:uid(),name:'Investimenti',kind:'investimenti',color:2,mode:'pct',value:15,cats:[C('Piano di accumulo','pct',15)]},
    {id:uid(),name:'Fondo emergenze',kind:'salvadanaio',color:4,mode:'pct',value:10,cats:[]}]}
];

function example(cycle=10){
  const b1={id:uid(),name:'Conto corrente',kind:'corrente',color:1,mode:'fixed',value:1100,cats:[C('Affitto','fixed',550),C('Spesa','fixed',300),C('Bollette','fixed',120),C('Abbonamenti','fixed',40)]};
  const b2={id:uid(),name:'Conto risparmio',kind:'risparmio',color:4,mode:'pct',value:15,cats:[C('Fondo emergenze','pct',8),C('Viaggi','pct',5)]};
  const b3={id:uid(),name:'Investimenti',kind:'investimenti',color:2,mode:'fixed',value:150,cats:[C('Piano di accumulo','fixed',150)]};
  const pr = periodOf(cycle);
  const ago = n => isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate()-n));
  // spese di esempio sparse nei giorni già passati del periodo, circa al ritmo della quota giornaliera
  const names = [['Spesa',22],['Pranzo',11],['Caffè',3],['Benzina',35],['Cena fuori',26],['Trasporti',6],['Shopping',18],['Spesa',16],['Svago',9],['Pranzo',10]];
  const spese = [];
  for (let k = 1; k < pr.dayIndex; k++){ const [n,v] = names[k % names.length]; spese.push({id:uid(), name:n, amount:v, date:ago(k), ts:100-k}); }
  spese.push({id:uid(), name:'Caffè', amount:2, date:TODAY, ts:200});
  return {v:3, example:true, salary:1850, payday:27, cycle, trackFrom:pr.startISO, trackExact:true, carries:{[pr.startISO]:{amount:38}}, carryNo:[], banks:[b1,b2,b3],
    extras:[{id:uid(),name:'Paghetta',amount:50,date:pr.dayIndex>3?ago(2):TODAY,ts:150}], spese,
    goals:[{id:uid(),name:'Auto nuova',color:3,target:8000,saved:1500,deadline:ymAhead(18),banks:[b2.id,b3.id]}]};
}
const okDay = x => x && /^\d{4}-\d{2}-\d{2}$/.test(x.date);
function normalize(s){
  if(!s || !Array.isArray(s.banks)) s = example();
  if ((s.v||1) < 2){
    s.banks.forEach(b=>{ b.mode='fixed'; b.value=+b.amount||0; b.kind=b.kind||'corrente'; delete b.amount;
      (b.cats||[]).forEach(c=>{ c.mode='fixed'; c.value=+c.amount||0; delete c.amount; }); });
    s.v = 2;
  }
  s.salary = +s.salary||0; s.payday = Math.min(31,Math.max(1,+s.payday||27)); s.cycle = Math.min(28,Math.max(1,+s.cycle||10));
  if (!/^\d{4}-\d{2}-\d{2}$/.test(s.trackFrom||'')){ s.trackFrom = TODAY; s._dirty = true; }
  s.trackExact = !!s.trackExact;
  s.carries = s.carries && typeof s.carries === 'object' && !Array.isArray(s.carries) ? s.carries : {};
  s.carryNo = Array.isArray(s.carryNo) ? s.carryNo : [];
  // tredicesima e quattordicesima: importo e data scelti in Opzioni, si ripetono ogni anno nello stesso giorno
  const yr = now.getFullYear(), md = {'13':'-12-15','14':'-07-01'};
  s.mens = s.mens && typeof s.mens==='object' ? s.mens : {};
  ['13','14'].forEach(k=>{ const m = s.mens[k] || {}; s.mens[k] = {on:!!m.on, amount: +m.amount || 0, date: /^\d{4}-\d{2}-\d{2}$/.test(m.date||'') ? m.date : yr+md[k]}; });
  delete s.bonus;
  s.extras = Array.isArray(s.extras) ? s.extras.filter(okDay).map(x=>({...x, amount:+x.amount||0})) : [];
  s.spese = Array.isArray(s.spese) ? s.spese.filter(okDay).map(x=>({...x, amount:+x.amount||0})) : [];
  s.goals = Array.isArray(s.goals)?s.goals:[];
  s.goals.forEach((g,i)=>{ g.color = g.color || ((i+2)%COLORS)+1; g.banks = g.banks||[]; g.target=+g.target||0; g.saved=+g.saved||0; });
  s.banks.forEach(b=>{ b.cats=Array.isArray(b.cats)?b.cats:[]; b.value=+b.value||0; b.color=b.color||1; b.kind=b.kind||'corrente'; b.mode=b.mode||'fixed';
    b.cats.forEach(c=>{ c.value=+c.value||0; c.mode=c.mode||'fixed'; }); });
  if ((s.v||2) < 3) migrate3(s);
  return s;
}
// Dalla v2: le % delle voci erano sul conto, ora sono sul netto; i soldi non assegnati a voci finiscono in "Altro".
function migrate3(s){
  const S = s.salary, amt = new Map(); let used = 0; const rest = [];
  s.banks.forEach(b=>{ if (b.mode==='rest'){ rest.push(b); return; } const a = b.mode==='pct' ? S*b.value/100 : b.value; amt.set(b.id,a); used += a; });
  rest.forEach(b=>amt.set(b.id, Math.max(0,S-used)/rest.length));
  s.banks.forEach(b=>{
    if (!b.cats.length) return;
    const ba = amt.get(b.id)||0; let tc = 0;
    b.cats.forEach(c=>{
      const ca = c.mode==='pct' ? ba*c.value/100 : c.value; tc += ca;
      if (c.mode==='pct') c.value = S>0 ? Math.round(ca/S*1000)/10 : 0; else c.mode = 'fixed';
    });
    if (b.mode==='rest') b.cats.push({id:uid(), name:'Altro', mode:'rest', value:0});
    else if (ba - tc > 0.5) b.cats.push({id:uid(), name:'Altro', mode:'fixed', value:Math.round(ba - tc)});
  });
  s.v = 3;
}

/* ---------- periodo di spesa ---------- */
// Dal giorno "cycle" di un mese allo stesso giorno del mese dopo: il numero di giorni resta fisso per tutto il periodo.
function periodOf(cycle, ref=now){
  const y = ref.getFullYear(), m = ref.getMonth();
  const at = (yy,mm) => new Date(yy, mm, Math.min(cycle, new Date(yy,mm+1,0).getDate()));
  const today = new Date(y,m,ref.getDate());
  let start = at(y,m); if (today < start) start = at(y,m-1);
  const end = at(start.getFullYear(), start.getMonth()+1);
  const last = new Date(end.getFullYear(), end.getMonth(), end.getDate()-1);
  const f = new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'long'});
  const days = Math.round((end-start)/864e5);
  return {days, dayIndex: Math.min(days, Math.round((today-start)/864e5)+1), from: f.format(start), to: f.format(last),
    startISO: isoDay(start), lastISO: isoDay(last), endISO: isoDay(end)};
}
// primo inizio di periodo (il giorno "cycle") uguale o successivo a una data
function startOnOrAfter(iso, cycle){
  const d = new Date(iso+'T12:00'), at = (y,m) => new Date(y, m, Math.min(cycle, new Date(y,m+1,0).getDate()), 12);
  let c = at(d.getFullYear(), d.getMonth()); if (isoDay(c) < iso) c = at(d.getFullYear(), d.getMonth()+1);
  return isoDay(c);
}
// prossima data (oggi compreso) di una mensilità che si ripete ogni anno; se il periodo in corso la contiene già, quella
function nextMens(iso){
  const p = periodOf(state.cycle), md = iso.slice(4);
  for (const y of [now.getFullYear()-1, now.getFullYear(), now.getFullYear()+1]){ const d = y+md; if (d>=iso && d>=p.startISO) return d; }
  return iso;
}
const fmtDay = iso => new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'long',year:'numeric'}).format(new Date(iso+'T12:00'));
function nextPay(){
  const d = state.payday, y = now.getFullYear(), m = now.getMonth();
  const clamp = (yy,mm) => Math.min(d, new Date(yy,mm+1,0).getDate());
  let t = new Date(y,m,clamp(y,m));
  const today = new Date(y,m,now.getDate());
  if (t < today) t = new Date(y,m+1,clamp(y,m+1));
  const days = Math.round((t - today)/864e5);
  return days===0 ? 'Accredito oggi' : days===1 ? 'Accredito domani' : `Accredito tra ${days} giorni`;
}

/* ---------- calcoli ---------- */
// Un conto con voci vale la somma delle sue voci. Voci e conti senza voci possono essere
// un importo fisso, una % del netto o "Resto", che si divide quello che avanza dello stipendio.
let Q;
// tredicesima/quattordicesima che cadono in un periodo (dalla data scelta in poi, ogni anno)
function mensIn(p){
  const items = [];
  ['13','14'].forEach(k=>{
    const m = state.mens[k]; if (!m.on || !(m.amount>0)) return;
    [...new Set([p.startISO.slice(0,4), p.endISO.slice(0,4)])].forEach(y=>{
      const iso = y + m.date.slice(4);
      if (iso>=p.startISO && iso<p.endISO && iso>=m.date) items.push({k, amount:m.amount, date:iso});
    });
  });
  return {amount: sum(items, x=>x.amount), items};
}
function allocate(S){
  const bank = new Map(), cat = new Map();
  let used = 0; const restB = [], restC = [];
  state.banks.forEach(b=>{
    if (b.cats.length){
      b.cats.forEach(c=>{
        if (c.mode==='rest'){ restC.push(c); return; }
        const a = c.mode==='pct' ? S*c.value/100 : c.value; cat.set(c.id,a); used += a;
      });
    } else {
      if (b.mode==='rest'){ restB.push(b); return; }
      const a = b.mode==='pct' ? S*b.value/100 : b.value; bank.set(b.id,a); used += a;
    }
  });
  const n = restB.length + restC.length, share = n ? Math.max(0, S-used)/n : 0;
  restB.forEach(b=>bank.set(b.id, share)); restC.forEach(c=>cat.set(c.id, share));
  state.banks.forEach(b=>{ if (b.cats.length) bank.set(b.id, sum(b.cats, c=>cat.get(c.id)||0)); });
  return {bank, cat, alloc: sum([...bank.values()]), hasRest: n>0};
}
function compute(){
  // la mensilità aggiuntiva si somma allo stipendio del periodo in cui arriva: le voci in % si calcolano anche su di essa
  const pr = periodOf(state.cycle), mens = mensIn(pr), Sal = state.salary, S = Sal + mens.amount;
  const {bank, cat, alloc, hasRest} = allocate(S);
  const inP = x => x.date>=pr.startISO && x.date<pr.endISO;
  const extras = state.extras.filter(inP), spese = state.spese.filter(inP);
  const extra = sum(extras, x=>x.amount);
  // Il conteggio parte dall'inizio del primo periodo pieno (il giorno "cycle") da quando usi l'app,
  // a meno che tu non abbia scelto "da oggi". Prima di allora l'app mostra solo l'anteprima.
  const startTrack = state.trackExact ? state.trackFrom : startOnOrAfter(state.trackFrom, state.cycle);
  const pending = startTrack > TODAY;
  const eff = pending ? startTrack : (startTrack > pr.startISO ? startTrack : pr.startISO);
  const dd = (a,b) => Math.round((new Date(b+'T12:00') - new Date(a+'T12:00'))/864e5);
  // avanzo del periodo precedente: si può aggiungere al budget di questo periodo
  const carryIn = !pending && state.carries[pr.startISO] ? state.carries[pr.startISO].amount : 0;
  const total = S + extra + carryIn, free = total - alloc;
  const daily = free>0 ? free/pr.days : 0;
  let prev = null;
  if (!pending){
    const ref = new Date(pr.startISO+'T12:00'); ref.setDate(ref.getDate()-1);
    const pp = periodOf(state.cycle, ref);
    if (startTrack < pp.endISO){
      const pIn = x => x.date>=pp.startISO && x.date<pp.endISO;
      const pS = Sal + mensIn(pp).amount;
      const pFree = pS + sum(state.extras.filter(pIn), x=>x.amount) + (state.carries[pp.startISO]?.amount||0) - allocate(pS).alloc;
      const pEff = startTrack > pp.startISO ? startTrack : pp.startISO;
      const pSpent = sum(state.spese.filter(x=>pIn(x) && x.date>=pEff), x=>x.amount);
      const left = Math.floor((pFree>0 ? pFree/pp.days : 0) * dd(pEff, pp.endISO) - pSpent);
      if (left > 0) prev = {amount:left, from:pp.from, to:pp.to, applied: !!state.carries[pr.startISO], declined: state.carryNo.includes(pr.startISO)};
    }
  }
  const counted = pending ? [] : spese.filter(x=>x.date>=eff);
  const spent = sum(counted, x=>x.amount), spentToday = sum(counted.filter(x=>x.date===TODAY), x=>x.amount);
  let next = null;
  if (pending){
    const np = periodOf(state.cycle, new Date(startTrack+'T12:00'));
    const nIn = x => x.date>=np.startISO && x.date<np.endISO;
    const nS = Sal + mensIn(np).amount;
    const nFree = nS + sum(state.extras.filter(nIn), x=>x.amount) - allocate(nS).alloc;
    next = {...np, free:nFree, daily: nFree>0 ? nFree/np.days : 0, inDays: Math.round((new Date(startTrack+'T12:00') - new Date(TODAY+'T12:00'))/864e5)};
  }
  const trackDays = Math.max(1, dd(eff, pr.endISO)), elapsed = Math.min(trackDays, dd(eff, TODAY)+1);
  const budget = daily*trackDays;
  const avail = daily*elapsed - spent;               // oggi: quota del giorno + avanzi (o meno gli sforamenti) dei giorni contati
  const carry = avail - (daily - spentToday);
  const effFrom = new Intl.DateTimeFormat('it-IT',{day:'numeric',month:'long'}).format(new Date(eff+'T12:00'));
  return {bank, cat, alloc, free, hasRest, extra, extras, total, period: pr, spese, spent, spentToday, daily, avail, carry,
    budget, left: budget - spent, trackDays, elapsed, partial: !pending && eff > pr.startISO, effFrom, pending, next, startTrack, carryIn, prev, mens, salary: Sal,
    offer: prev && !prev.applied && !prev.declined ? prev : null};
}
const B = id => state.banks.find(b=>b.id===id);
const G = id => state.goals.find(g=>g.id===id);

function goalPlan(g){
  const need = Math.max(0, g.target - g.saved);
  let months = 12, past=false, dk=null;
  if (/^\d{4}-\d{2}$/.test(g.deadline||'')){
    const [y,m] = g.deadline.split('-').map(Number); dk = y*12+m-1;
    months = dk - curKey; if (months < 1){ past = months < 0; months = 1; }
  }
  const monthly = Math.ceil(need / months);
  let picks = state.banks.filter(b => g.banks.includes(b.id));
  if (!picks.length) picks = state.banks.slice();
  const w = sum(picks,b=>Q.bank.get(b.id)||0);
  const split = picks.map(b => ({b, v: Math.floor(monthly * (w>0 ? (Q.bank.get(b.id)||0)/w : 1/picks.length))}));
  const diff = monthly - sum(split,s=>s.v);
  if (split.length && diff){ [...split].sort((a,b)=>(Q.bank.get(b.b.id)||0)-(Q.bank.get(a.b.id)||0))[0].v += diff; }
  const share = state.salary>0 ? monthly/state.salary : null;
  let level = null;
  if (share!==null) level = share<=.15 ? ['good','Sostenibile'] : share<=.30 ? ['warn','Impegnativo'] : ['crit','Molto ambizioso'];
  const pace = sum(state.banks.flatMap(b=>b.cats.filter(c=>c.goalId===g.id)), c=>Q.cat.get(c.id)||0);
  const eta = pace>0 && need>0 ? curKey + Math.ceil(need/pace) : null;
  return {need, months, past, monthly, split, share, level, pace, eta, dk, pct: g.target>0 ? Math.min(1, g.saved/g.target) : 0};
}
const money = v => v < 0 ? '−' + eur.format(Math.abs(v)) : eur.format(v);
const todayVal = () => Q.avail >= 0 ? Math.floor(Q.avail) : -Math.ceil(-Q.avail);

  const v = todayVal();
  return `<div class="mini-in"><div><small>Oggi puoi spendere</small><b class="${v<0?'neg':''}">${money(v)}</b></div><div class="r"><small>Rimane nel periodo</small><b class="${Q.left<0?'neg':''}">${money(Q.left)}</b></div></div>`;
}

/* ---------- movimenti ---------- */
function movesHTML(){
  const pr = Q.period;
  const items = [...Q.spese.map(x=>({...x,k:'spesa'})), ...Q.extras.map(x=>({...x,k:'cash'})),
    ...Q.mens.items.map(x=>({id:'m'+x.k, k:'mens', kind:x.k, name:MENS_NAME[x.k], amount:x.amount, date:x.date, ts:-2})),
    ...(Q.carryIn>0 ? [{id:'carry', k:'carry', name:'Avanzo del mese scorso', amount:Q.carryIn, date:pr.startISO, ts:-1}] : [])]
    .sort((a,b)=> b.date.localeCompare(a.date) || (b.ts||0)-(a.ts||0));
  const head = Q.pending ? `<p class="period">Il conteggio delle spese parte il <b>${Q.next?.from||''}</b>. Quello che registri prima resta qui, ma non incide sul budget.</p>`
    : `<p class="period">Dal ${pr.from} al ${pr.to} · spesi <b>${eur.format(Q.spent)}</b>${Q.free>0.5?` su ${eur.format(Math.round(Q.budget))}`:''}</p>`;
  if (!items.length) return head + `<div class="empty"><b>Nessun movimento</b><span>Registra quello che spendi: il riquadro «Oggi» si aggiorna da solo.</span><button class="btn" data-a="quick" data-k="spesa">${ui_('plus','i s')}Nuova spesa</button></div>`;
  const yest = isoDay(new Date(now.getFullYear(), now.getMonth(), now.getDate()-1));
  const fd = new Intl.DateTimeFormat('it-IT',{weekday:'long',day:'numeric',month:'long'});
  const groups = [];
  items.forEach(x=>{ const g = groups[groups.length-1]; if (g && g.date===x.date) g.items.push(x); else groups.push({date:x.date, items:[x]}); });
  return head + '<section class="day">' + groups.map(g=>{
    const lbl = g.date===TODAY ? 'Oggi' : g.date===yest ? 'Ieri' : fd.format(new Date(g.date+'T12:00'));
    const out = sum(g.items.filter(x=>x.k==='spesa'), x=>x.amount);
    const nsp = g.items.filter(x=>x.k==='spesa').length;
    return `<div class="dgroup"><div class="dayh"><span>${lbl.charAt(0).toUpperCase()+lbl.slice(1)}</span>${out>0&&nsp>1?`<b>−${eur.format(out)}</b>`:''}</div>
      ${g.items.map(x=> x.k==='mens' ? `<button class="mv" data-a="settings"><span class="mvi cash">${x.kind}ª</span>
        <span class="mvn"><span>${esc(x.name)}</span><small>Insieme allo stipendio</small></span><span class="mva cash">+ ${eur.format(x.amount)}</span></button>` : x.k==='carry' ? `<div class="mv"><span class="mvi cash">${ui_('plus','i s')}</span>
        <span class="mvn"><span>${esc(x.name)}</span><small>Aggiunto al budget</small></span><span class="mva cash">+ ${eur.format(x.amount)}</span></div>` : `<button class="mv" data-a="edit-move" data-k="${x.k}" data-x="${x.id}">
        <span class="mvi ${x.k}">${x.k==='cash'?'+':esc((x.name||'S').trim().charAt(0).toUpperCase())}</span>
        <span class="mvn"><span>${esc(x.name||(x.k==='cash'?'Contanti':'Spesa'))}</span>${x.k==='cash'?'<small>Contanti</small>':''}</span>
        <span class="mva ${x.k}">${x.k==='cash'?'+ ':'−'}${eur.format(x.amount)}</span></button>`).join('')}
    </div>`;
  }).join('') + '</section>';
}

/* ---------- conti e obiettivi ---------- */
function bankCard(b){
  const ba = Q.bank.get(b.id)||0, n = b.cats.length, S = state.salary;
  const kind = KIND_FULL[b.kind]||'Conto', pc = S>0 ? `${pnum.format(ba/S*100)}% del netto` : '';
  const sub = (b.name||'').trim().toLowerCase()===kind.toLowerCase() || !b.name ? pc || kind : [kind, pc].filter(Boolean).join(' · ');
  const how = n ? 'Somma delle voci' : b.mode==='pct' ? `${pnum.format(b.value)}% del netto` : b.mode==='rest' ? 'Quello che avanza' : 'Importo fisso';
  // voci in ordine di grandezza, dalla più grande
  const sorted = [...b.cats].sort((x,y)=>(Q.cat.get(y.id)||0)-(Q.cat.get(x.id)||0));
  const live = sorted.filter(c=>(Q.cat.get(c.id)||0)>0.004);
  const op = i => Math.max(.32, 1 - i*.15);
  const bar = n && ba>0 ? `<div class="vbar">${live.map((c,i)=>`<i style="flex:${Q.cat.get(c.id)};opacity:${op(i)}"></i>`).join('')}</div>` : '';
  const rows = sorted.map((c,i)=>{
    const ca = Q.cat.get(c.id)||0, badge = c.mode==='pct' ? pnum.format(c.value)+'%' : c.mode==='rest' ? 'Resto' : '';
    return `<button class="row" data-a="edit-cat" data-b="${b.id}" data-c="${c.id}">
      <span class="dot" style="opacity:${op(i)}"></span>
      <span class="rn ${c.name?'':'empty'}"><span>${esc(c.name||'Senza nome')}</span>${c.goalId?'<span class="tag">Obiettivo</span>':''}</span>
      <span class="rm">${badge}</span><span class="ra">${eur.format(ca)}</span></button>`;
  }).join('');
  const open = ui.open.has(b.id);
  return `<article class="acct ${n?'':'nocats'} ${open?'open':''}" style="--c:var(--b${b.color})">
    <button class="acct-head" data-a="acct-toggle" data-b="${b.id}" aria-expanded="${open}" aria-label="${esc(b.name||'Conto')}, ${eur.format(ba)}. ${open?'Chiudi':'Mostra le voci'}">
      <span class="ico">${icon(b.kind)}</span>
      <span class="who"><span class="an">${esc(b.name||'Nuovo conto')}</span><span class="ak">${esc(sub)}</span></span>
      <span class="at"><b>${eur.format(ba)}</b><small>${n ? `${n} ${n===1?'voce':'voci'}` : how}</small></span>
      <span class="achev">${ui_('chev','i s')}</span>
    </button>
    ${bar}
    ${open ? `<div class="adrop">
      ${n ? `<div class="rows">${rows}</div>` : `<p class="anote">${how}. Dividilo in voci per vedere dove vanno i soldi.</p>`}
      <div class="afoot">
        <button class="addrow" data-a="add-cat" data-b="${b.id}">${ui_('plus','i s')}${n?'Aggiungi voce':'Dividi in voci'}</button>
        <button class="addrow edit" data-a="custom" data-b="${b.id}">${ui_('edit','i s')}Modifica conto</button>
      </div></div>` : ''}
  </article>`;
}

function ring(pct){
  const r = 23, C = 2*Math.PI*r;
  return `<svg viewBox="0 0 56 56" aria-hidden="true"><circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="5"/>
    <circle cx="28" cy="28" r="${r}" fill="none" stroke="var(--c)" stroke-width="5" stroke-linecap="round" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${(C*(1-pct)).toFixed(2)}" transform="rotate(-90 28 28)" ${pct<=0?'opacity="0"':''}/></svg>`;
}
function goalCard(g){
  const p = goalPlan(g), reached = g.target>0 && g.saved>=g.target;
  const linked = state.banks.some(b=>b.cats.some(c=>c.goalId===g.id));
  const dl = p.dk!==null ? 'Entro ' + monthName(p.dk) : 'Senza scadenza';
  const notes = [];
  if (p.past) notes.push('La data scelta è già passata: il calcolo considera un solo mese.');
  else notes.push(`Per ${p.months} ${p.months===1?'mese':'mesi'}, fino a ${monthName(curKey+p.months)}.`);
  if (p.pace>0 && p.eta!==null){
    const late = p.dk!==null && p.eta > p.dk;
    notes.push(`Al ritmo attuale di <b>${eur.format(p.pace)} al mese</b> lo raggiungi a <b>${monthName(p.eta)}</b>${late?', dopo la data che hai scelto.':p.dk!==null?', in tempo.':'.'}`);
  }
  if (Q.free>0.5 && p.monthly>0 && !linked) notes.push(`Hai <b>${eur.format(Q.free)}</b> di budget spendibile: ${Q.free>=p.monthly?'bastano a coprirlo.':'ne coprono una parte.'}`);
  return `<article class="goal" style="--c:var(--b${g.color})">
    <button class="goal-top" data-a="edit-goal" data-g="${g.id}" aria-label="Modifica obiettivo ${esc(g.name)}">
      <span class="ringw">${ring(p.pct)}<span>${Math.round(p.pct*100)}%</span></span>
      <span class="who"><span class="gn">${esc(g.name||'Nuovo obiettivo')}</span><span class="gd">${dl}</span></span>
      <span class="chev">${ui_('chev')}</span>
    </button>
    <div class="gline"><span><b>${eur.format(g.saved)}</b> di ${eur.format(g.target)}</span><span>${reached?'Completato':'mancano '+eur.format(p.need)}</span></div>
    ${reached ? `<div class="done">${ui_('check')}Obiettivo raggiunto</div>` : `
    <div class="plan">
      <div class="ptop"><div><span class="lbl">Da mettere da parte</span><span class="val">${eur.format(p.monthly)}<small> al mese</small></span></div>
        ${p.level?`<span class="chip ${p.level[0]}"><i></i>${p.level[1]} · ${pnum.format(p.share*100)}% del netto</span>`:''}</div>
      ${notes.map(t=>`<p>${t}</p>`).join('')}
      ${state.banks.length && p.split.length ? `<div class="split">${p.split.map(s=>`<div style="--c:var(--b${s.b.color})"><i></i><span>${esc(s.b.name||'Conto')}</span><b>${eur.format(s.v)} al mese</b></div>`).join('')}</div>` : '<p>Aggiungi un conto per sapere da dove prendere i soldi.</p>'}
      <div class="actions">
        ${state.banks.length && p.monthly>0 ? `<button class="btn" data-a="apply" data-g="${g.id}">${linked?'Aggiorna nel piano':'Inserisci nel piano'}</button>`:''}
        ${p.monthly>0 ? `<button class="btn2" data-a="deposit" data-g="${g.id}">Registra versamento di ${eur.format(p.pace>0?Math.round(p.pace):p.monthly)}</button>`:''}
      </div>
    </div>`}
  </article>`;
}

const TABS = [['movimenti','Movimenti'],['conti','Conti'],['obiettivi','Obiettivi']];
function mainHTML(){
  const t = ui.tab;
  const banner = state.example ? `<div class="notice"><span><b>Dati di esempio.</b> Sostituiscili con i tuoi o parti da zero.</span>
    <div class="nb"><button class="btn2 sm" data-a="settings">Modelli</button><button class="btn sm" data-a="clear">Parti da zero</button></div></div>` : '';
  const action = t==='movimenti' ? `<button class="btn sm only-desk" data-a="quick" data-k="spesa">${ui_('plus','i s')}Nuova spesa</button>`
    : t==='conti' ? `<button class="btn2 sm" data-a="add-bank">${ui_('plus','i s')}Nuovo conto</button>`
    : `<button class="btn2 sm" data-a="add-goal">${ui_('plus','i s')}Nuovo obiettivo</button>`;
  const head = `<div class="mainhead"><h2>${TABS.find(x=>x[0]===t)[1]}</h2>
    <div class="tabs" role="tablist">${TABS.map(([k,l])=>`<button role="tab" data-a="tab" data-t="${k}" aria-selected="${t===k}">${l}</button>`).join('')}</div>
    ${action}</div>`;
  let body;
  if (t==='movimenti') body = movesHTML();
  else if (t==='conti') body = state.banks.length ? state.banks.map(bankCard).join('')
    : `<div class="empty"><b>Nessun conto</b><span>Aggiungi le banche su cui dividi lo stipendio, oppure parti da un modello.</span><div class="actions" style="justify-content:center"><button class="btn" data-a="add-bank">Aggiungi un conto</button><button class="btn2" data-a="settings">Modelli</button></div></div>`;
  else body = state.goals.length ? state.goals.map(goalCard).join('')
    : `<div class="empty"><b>Nessun obiettivo</b><span>Un viaggio, un'auto, un fondo per le emergenze: calcolo quanto mettere da parte ogni mese.</span><button class="btn" data-a="add-goal">Crea un obiettivo</button></div>`;
  return banner + head + body;
}

function tabbarHTML(){
  const b = (k,l) => `<button data-a="tab" data-t="${k}" aria-current="${ui.tab===k?'page':'false'}">${ui_(k)}${l}</button>`;

const foot = del => `<div class="sh-foot">${del||'<span class="sp"></span>'}<button class="btn" data-a="close">Fatto</button></div>`;

const amtIn = (id,k,v,attrs,unit,cls='') => `<div class="amt ${cls}"><input id="${id}" data-k="${k}" ${attrs} inputmode="decimal" autocomplete="off" enterkeyhint="done" value="${unit==='%'?pnum.format(v):num.format(v)}" aria-label="${unit==='%'?'Percentuale del netto':'Importo in euro'}"><span>${unit}</span></div>`;
const seg = (action, attrs, cur, opts, cls='') => `<div class="seg ${cls}">${opts.map(([v,l,s])=>`<button data-a="${action}" ${attrs} data-v="${v}" aria-pressed="${cur===v}">${l}${s?`<small>${s}</small>`:''}</button>`).join('')}</div>`;

  return `<div class="sheet" role="dialog" aria-modal="true" aria-label="Opzioni">${head('Opzioni')}
    <div class="f"><label for="cycle">Mese di spesa</label>
      <select class="in" id="cycle" data-k="cycle">${Array.from({length:28},(_,i)=>`<option value="${i+1}" ${state.cycle===i+1?'selected':''}>${i===0?'Dal 1 alla fine del mese':`Dal ${i+1} al ${i} del mese dopo`}</option>`).join('')}</select>
      <p class="hint">La quota al giorno è il budget spendibile diviso per i giorni di questo periodo, e resta fissa. Spese e contanti valgono per il periodo in cui li registri.</p></div>
    ${Q.pending ? `<div class="f"><span class="fl">Inizio del conteggio</span>
      <p class="hint">Le spese si contano dal <b>${Q.next?.from}</b>, primo giorno del nuovo periodo.</p>
      <div class="order"><button class="btn2 sm" data-a="track-now">Inizia da oggi</button></div></div>` : ''}
    <div class="f"><span class="fl">Tredicesima e quattordicesima</span>
      ${['13','14'].map(k=>{ const m = state.mens[k], pdm = periodOf(state.cycle, new Date(nextMens(m.date)+'T12:00'));
        return `<div class="mcard">
          <div class="mhead"><span>${MENS_NAME[k]}</span><button class="switch" data-a="mtoggle" data-v="${k}" aria-pressed="${m.on}" aria-label="${m.on?'Disattiva':'Attiva'} ${MENS_NAME[k].toLowerCase()}"></button></div>
          ${m.on ? `<div class="fgrid">
            <div class="f"><label for="ms-a-${k}">Importo netto</label>${amtIn('ms-a-'+k,'mens.amount',m.amount,`data-m="${k}"`,'€','sm')}</div>
            <div class="f"><label for="ms-d-${k}">Data</label><input class="in" type="date" id="ms-d-${k}" data-k="mens.date" data-m="${k}" value="${esc(m.date)}"></div>
          </div>
          <p class="hint">${(()=>{ const o = nextMens(m.date);
            return o<=TODAY ? `Aggiunta allo stipendio di questo periodo (${fmtDay(o)}).` : o<Q.period.endISO ? `Arriva il ${fmtDay(o)}: si aggiunge allo stipendio di questo periodo.` : `Arriva il ${fmtDay(o)}: si aggiunge allo stipendio del periodo dal ${pdm.from} al ${pdm.to}.`; })()} Si ripete ogni anno nella stessa data.</p>` : ''}
        </div>`; }).join('')}
      <p class="hint">Si sommano allo stipendio del periodo in cui arrivano: anche le voci in percentuale si calcolano su di esse, il resto va nel budget spendibile. Puoi scegliere anche una data passata.</p></div>
    <div class="f"><label for="payday">Giorno di accredito dello stipendio</label>
      <select class="in" id="payday" data-k="payday">${Array.from({length:31},(_,i)=>`<option value="${i+1}" ${state.payday===i+1?'selected':''}>Il ${i+1} del mese</option>`).join('')}</select>
      <p class="hint">${nextPay()}.</p></div>
    <div class="f"><span class="fl">Parti da un modello</span>
      <div class="tpl">${TEMPLATES.map(t=>`<button data-a="tpl" data-v="${t.id}" class="${armed==='t'+t.id?'arm':''}">
        <span class="mini-b">${t.mini.map(([f,c])=>c?`<i style="flex:${f};background:var(--b${c})"></i>`:`<i class="fr" style="flex:${f}"></i>`).join('')}</span>
        <span><strong>${armed==='t'+t.id?'Tocca di nuovo per sostituire i conti':t.name}</strong><span>${t.desc}</span></span></button>`).join('')}</div>
      <p class="hint">Un modello sostituisce i conti attuali. Stipendio, movimenti e obiettivi restano.</p></div>
    <p class="hint">${savedLabel}</p>
    ${foot(`<button class="btn-danger ${armed==='reset'?'arm':''}" data-a="reset">${armed==='reset'?'Conferma: cancella tutto':'Cancella tutti i dati'}</button>`)}
  </div>`;
}

/* ---------- rendering ---------- */
function render(){
  const a = document.activeElement, keep = a && a.id && a.tagName==='INPUT'
    ? {id:a.id, v:a.value, s:a.selectionStart, e:a.selectionEnd} : null;
  const scroller = document.querySelector('.sheet'), sTop = scroller ? scroller.scrollTop : 0;
  Q = compute();
  document.getElementById('summary').innerHTML = summaryHTML();
  document.getElementById('main').innerHTML = mainHTML();
  document.getElementById('tabbar').innerHTML = tabbarHTML();
  document.getElementById('mini').innerHTML = miniHTML();
  const layer = document.getElementById('layer'), sh = ui.sheet;
  let html = '';
  if (sh){
    if (sh.type==='settings') html = settingsSheet();
    else if (sh.type==='move') html = moveSheet();
    else if (sh.type==='bank' && B(sh.id)) html = bankSheet(B(sh.id));
    else if (sh.type==='goal' && G(sh.id)) html = goalSheet(G(sh.id));
    else if (sh.type==='cat'){ const b = B(sh.bid), c = b && b.cats.find(x=>x.id===sh.id); if (c) html = catSheet(b,c); }
  }
  if (html){
    const fresh = !layer.firstChild;
    layer.innerHTML = `<div class="scrim" data-a="scrim">${html}</div>`;
    if (!fresh){ layer.querySelector('.scrim').style.animation='none'; const s = layer.querySelector('.sheet'); s.style.animation='none'; s.scrollTop = sTop; }
    document.body.style.overflow='hidden';
  } else { ui.sheet = null; layer.innerHTML = ''; document.body.style.overflow=''; }
  sizeInputs(); onScroll();
  if (keep){
    const el = document.getElementById(keep.id);
    if (el){ el.value = keep.v; el.focus({preventScroll:true}); try{ el.setSelectionRange(keep.s, keep.e); }catch(e){} sizeInputs(); }
  }
}
function sizeInputs(){
  const s = document.getElementById('in-salary'); if (s) s.style.width = Math.max(3, s.value.length+0.5)+'ch';
  const q = document.getElementById('qa-amt'); if (q) q.style.width = Math.max(2, (q.value||'0').length+0.4)+'ch';
}
function openSheet(s, focusId){
  ui.sheet = s; ui.armed = null;
  document.getElementById('layer').innerHTML = '';
  render();
  if (focusId) setTimeout(()=>document.getElementById(focusId)?.focus(), 80);
}
function openMove(k, item){
  ui.draft = item ? {k, id:item.id, name:item.name||'', amount:num.format(item.amount), date:item.date}
                  : {k, id:null, name:'', amount:'', date:TODAY};
  openSheet({type:'move'}, item ? null : 'qa-amt');
}
const listOf = k => k==='cash' ? state.extras : state.spese;

/* ---------- eventi ---------- */
function onInput(e){
  const el = e.target;
  if (el.dataset.d){ ui.draft[el.dataset.d] = el.value; sizeInputs(); return; }
  const k = el.dataset.k; if(!k) return;
  const b = el.dataset.b && B(el.dataset.b);
  const c = b && el.dataset.c && b.cats.find(x=>x.id===el.dataset.c);
  const g = el.dataset.g && G(el.dataset.g);
  const isNum = /value|salary|target|saved|amount/.test(k);
  const v = isNum ? parseNum(el.value) : el.value;
  if (isNum && v===null) return;
  switch(k){
    case 'salary': state.salary=v; break;
    case 'payday': state.payday=+v; break;
    case 'cycle': state.cycle=+v; break;
    case 'mens.amount': state.mens[el.dataset.m].amount = v; break;
    case 'mens.date': if (/^\d{4}-\d{2}-\d{2}$/.test(v)) state.mens[el.dataset.m].date = v; break;
    case 'bank.name': b.name=v; break;
    case 'bank.value': b.value=v; break;
    case 'cat.name': c.name=v; break;
    case 'cat.value': c.value=v; break;
    case 'goal.name': g.name=v; break;
    case 'goal.target': g.target=v; break;
    case 'goal.saved': g.saved=v; break;
    case 'goal.deadline': g.deadline=v; break;
  }
  touch(); render();
}
function onBlur(e){
  const el = e.target;
  if (el.dataset?.k && /value|salary|target|saved|amount/.test(el.dataset.k)){
    const v = parseNum(el.value);
    if (v!==null) el.value = el.parentElement.querySelector('span')?.textContent==='%' ? pnum.format(v) : num.format(v);
    sizeInputs();
  }
}

let armT;
function arm(key){ ui.armed = key; clearTimeout(armT); armT = setTimeout(()=>{ ui.armed=null; render(); }, 3500); }

function onClick(e){
  const t = e.target.closest('[data-a]'); if(!t) return;
  const a = t.dataset.a;
  if (a==='scrim' && e.target!==t) return;
  const b = t.dataset.b && B(t.dataset.b), g = t.dataset.g && G(t.dataset.g), S = state.salary;
  switch(a){
    case 'tab': {
      const changed = ui.tab !== t.dataset.t;
      ui.tab = t.dataset.t; try{ localStorage.setItem('quote-tab', ui.tab); }catch(e){}
      render();
      if (changed && innerWidth < 960) document.getElementById('main').scrollIntoView({behavior:'smooth', block:'start'});
      return; }
    case 'scrim': case 'close': ui.sheet=null; ui.armed=null; break;
    case 'settings': openSheet({type:'settings'}); return;
    case 'quick': openMove(t.dataset.k||'spesa'); return;
    case 'edit-move': { const it = listOf(t.dataset.k).find(x=>x.id===t.dataset.x); if (it) openMove(t.dataset.k, it); return; }
    case 'qkind': ui.draft.k = t.dataset.v; ui.draft.name = ''; break;
    case 'qname': ui.draft.name = t.dataset.v; break;
    case 'save-move': {
      const d = ui.draft, v = parseNum(d.amount);
      if (!v){ toast('Scrivi un importo maggiore di zero.'); document.getElementById('qa-amt')?.focus(); return; }
      const date = /^\d{4}-\d{2}-\d{2}$/.test(d.date) ? d.date : TODAY, name = (d.name||'').trim() || (d.k==='cash'?'Contanti':'Spesa');
      const list = listOf(d.k);
      if (d.id){ const it = list.find(x=>x.id===d.id); if (it) Object.assign(it, {name, amount:v, date}); }
      else list.push({id:uid(), name, amount:v, date, ts:Date.now()});
      ui.sheet = null; touch(); Q = compute();
      toast(d.id ? 'Modifiche salvate.' : d.k==='cash' ? `Aggiunti ${eur.format(v)} ai contanti.` : Q.pending ? 'Spesa registrata.' : Q.free>0.5 ? `Spesa registrata. Oggi puoi spendere ancora ${money(todayVal())}.` : 'Spesa registrata.');
      break; }
    case 'del-move': {
      const d = ui.draft;
      if (ui.armed!=='m'+d.id){ arm('m'+d.id); break; }
      if (d.k==='cash') state.extras = state.extras.filter(x=>x.id!==d.id); else state.spese = state.spese.filter(x=>x.id!==d.id);
      ui.armed=null; ui.sheet=null; touch(); toast('Movimento eliminato.'); break; }
    case 'track-now': state.trackFrom = TODAY; state.trackExact = true; touch(); toast('Il conteggio parte da oggi.'); break;
    case 'mtoggle': { const m = state.mens[t.dataset.v]; m.on = !m.on; if (m.on && !m.amount) m.amount = state.salary; touch(); break; }
    case 'carry-add': {
      const a = Q.prev?.amount || 0; if (!a) break;
      state.carries[Q.period.startISO] = {amount:a}; state.carryNo = state.carryNo.filter(x=>x!==Q.period.startISO);
      touch(); toast(`Aggiunti ${eur.format(a)} al budget di questo mese.`); break; }
    case 'carry-no': state.carryNo.push(Q.period.startISO); touch(); toast('Va bene. Puoi aggiungerli quando vuoi da «Totale del mese».'); break;
    case 'carry-row':
      if (Q.carryIn>0){
        if (ui.armed!=='carry'){ arm('carry'); break; }
        delete state.carries[Q.period.startISO]; if (!state.carryNo.includes(Q.period.startISO)) state.carryNo.push(Q.period.startISO);
        ui.armed=null; touch(); toast('Avanzo tolto dal budget.');
      } else if (Q.prev){ state.carries[Q.period.startISO] = {amount:Q.prev.amount}; state.carryNo = state.carryNo.filter(x=>x!==Q.period.startISO); touch(); toast(`Aggiunti ${eur.format(Q.prev.amount)} al budget di questo mese.`); }
      break;
    case 'srctoggle': ui.srcOpen = !ui.srcOpen; try{ localStorage.setItem('quote-src', ui.srcOpen?'1':'0'); }catch(e){} break;
    case 'acct-toggle': setOpen(b.id, !ui.open.has(b.id)); break;
    case 'custom': openSheet({type:'bank', id:b.id}); return;
    case 'edit-cat': openSheet({type:'cat', id:t.dataset.c, bid:b.id}); return;
    case 'edit-goal': openSheet({type:'goal', id:g.id}); return;
    case 'clear':
      state = normalize({v:3, example:false, salary:0, payday:state.payday, cycle:state.cycle, trackFrom:TODAY, trackExact:false, carries:{}, carryNo:[], extras:[], spese:[], banks:[{id:uid(),name:'Conto principale',kind:'corrente',color:1,mode:'fixed',value:0,cats:[]}], goals:[]});
      ui.srcOpen = true; save(); render(); setTimeout(()=>{ const el = document.getElementById('in-salary'); el?.focus(); el?.select(); },0); toast('Pagina pulita. Inizia dal tuo stipendio.'); return;
    case 'reset':
      if (ui.armed!=='reset'){ arm('reset'); break; }
      state = normalize({v:3, example:false, salary:0, payday:27, cycle:10, trackFrom:TODAY, trackExact:false, carries:{}, carryNo:[], extras:[], spese:[], banks:[], goals:[]}); ui.armed=null; ui.sheet=null; save(); toast('Dati cancellati.'); break;
    case 'tpl': {
      if (ui.armed!=='t'+t.dataset.v){ arm('t'+t.dataset.v); break; }
      const tp = TEMPLATES.find(x=>x.id===t.dataset.v);
      state.banks = tp.build(); state.goals.forEach(x=>x.banks=[]); ui.armed=null; ui.sheet=null; ui.tab='conti'; touch();
      toast(`Modello «${tp.name}» applicato.`); break; }
    case 'add-bank': {
      const used = state.banks.map(x=>x.color); const color = Array.from({length:COLORS},(_,i)=>i+1).find(n=>!used.includes(n)) || (state.banks.length%COLORS)+1;
      const nb = {id:uid(),name:'',kind:'corrente',color,mode:'fixed',value:0,cats:[]}; state.banks.push(nb); ui.tab='conti'; setOpen(nb.id,true); touch();
      openSheet({type:'bank', id:nb.id}, 'sn-'+nb.id); return; }
    case 'kind': b.kind = t.dataset.v; touch(); break;
    case 'setcolor': b.color = +t.dataset.v; touch(); break;
    case 'setmode': {
      const ba = Q.bank.get(b.id)||0, nm = t.dataset.v;
      if (nm===b.mode || b.cats.length) break;
      b.value = nm==='pct' ? (S>0 ? round1(ba/S*100) : 0) : nm==='fixed' ? Math.round(ba) : 0;
      b.mode = nm; touch(); break; }
    case 'csetmode': {
      const c = b.cats.find(x=>x.id===t.dataset.c), ca = Q.cat.get(c.id)||0, nm = t.dataset.v;
      if (nm===c.mode) break;
      c.value = nm==='pct' ? (S>0 ? round1(ca/S*100) : 0) : nm==='fixed' ? Math.round(ca) : 0;
      c.mode = nm; touch(); break; }
    case 'move': {
      const i = state.banks.indexOf(b), j = i + (+t.dataset.v);
      if (j<0 || j>=state.banks.length) break;
      [state.banks[i], state.banks[j]] = [state.banks[j], state.banks[i]]; touch(); break; }
    case 'del-bank':
      if (ui.armed!=='b'+b.id){ arm('b'+b.id); break; }
      state.banks = state.banks.filter(x=>x!==b); state.goals.forEach(x=>x.banks=x.banks.filter(id=>id!==b.id)); ui.armed=null; ui.sheet=null; touch(); toast('Conto eliminato.'); break;
    case 'add-cat': {
      // la prima voce eredita l'importo del conto, così il totale non cambia
      const nc = b.cats.length ? {id:uid(),name:'',mode:'fixed',value:0} : {id:uid(),name:'',mode:b.mode,value:b.value};
      b.cats.push(nc); setOpen(b.id,true); touch();
      openSheet({type:'cat', id:nc.id, bid:b.id}, 'sc-n-'+nc.id); return; }
    case 'del-cat': {
      if (ui.armed!=='c'+t.dataset.c){ arm('c'+t.dataset.c); break; }
      const c = b.cats.find(x=>x.id===t.dataset.c);
      b.cats = b.cats.filter(x=>x!==c);
      if (!b.cats.length && c){ b.mode = c.mode; b.value = c.value; }
      ui.armed=null; ui.sheet=null; touch(); toast('Voce eliminata.'); break; }
    case 'add-goal': {
      const ng = {id:uid(),name:'',color:((state.goals.length+2)%COLORS)+1,target:1000,saved:0,deadline:ymAhead(12),banks:[]}; state.goals.push(ng); ui.tab='obiettivi'; touch();
      openSheet({type:'goal', id:ng.id}, 'gn-'+ng.id); return; }
    case 'gsetcolor': g.color = +t.dataset.v; touch(); break;
    case 'del-goal':
      if (ui.armed!=='g'+g.id){ arm('g'+g.id); break; }
      state.goals = state.goals.filter(x=>x!==g);
      state.banks.forEach(x=>x.cats.forEach(c=>{ if(c.goalId===g.id) delete c.goalId; }));
      ui.armed=null; ui.sheet=null; touch(); toast('Obiettivo eliminato.'); break;
    case 'tog': { const i = g.banks.indexOf(b.id); i>=0 ? g.banks.splice(i,1) : g.banks.push(b.id); touch(); break; }
    case 'apply': {
      const p = goalPlan(g), label = g.name || 'Obiettivo';
      state.banks.forEach(x=>{
        const s = p.split.find(s=>s.b===x), c = x.cats.find(c=>c.goalId===g.id);
        const nv = s ? s.v : 0;
        if (c){
          if (nv>0){ c.mode='fixed'; c.value = nv; c.name = label; }
          else { x.cats = x.cats.filter(y=>y!==c); if (!x.cats.length){ x.mode='fixed'; x.value=0; } }
        } else if (nv>0){
          if (!x.cats.length) x.cats.push({id:uid(), name:'Altro', mode:x.mode, value:x.value});
          x.cats.push({id:uid(), name:label, mode:'fixed', value:nv, goalId:g.id});
        }
      });
      touch(); Q = compute();
      toast(Q.free<-0.5 ? `Inserito. Ora sfori di ${eur.format(-Q.free)}: riduci qualche voce.` : `Inserito: ${eur.format(p.monthly)} al mese per «${label}».`);
      break; }
    case 'deposit': {
      const p = goalPlan(g), v = p.pace>0 ? Math.round(p.pace) : p.monthly;
      g.saved = Math.min(g.target, g.saved + v); touch();
      toast(g.saved>=g.target ? 'Obiettivo raggiunto!' : `Registrati ${eur.format(v)}. Ne mancano ${eur.format(g.target-g.saved)}.`); break; }
  }
  render();
}

for (const id of ['summary','main','tabbar','layer']){
  const root = document.getElementById(id);
  root.addEventListener('input', onInput);
  root.addEventListener('focusout', onBlur);
  root.addEventListener('click', onClick);
  root.addEventListener('keydown', e => {
    if (e.key!=='Enter' || e.target.tagName!=='INPUT') return;
    if (e.target.dataset.d && ui.sheet?.type==='move'){ e.preventDefault(); document.querySelector('[data-a="save-move"]')?.click(); return; }
    e.target.blur();
  });
}
document.addEventListener('keydown', e => { if (e.key==='Escape' && ui.sheet){ ui.sheet=null; ui.armed=null; render(); } });

// barra compatta: compare quando il riquadro "Oggi" esce dallo schermo
function onScroll(){
  const h = document.getElementById('hero'), m = document.getElementById('mini');
  if (h && m) m.classList.toggle('on', h.getBoundingClientRect().bottom < 8 && !ui.sheet);
}
addEventListener('scroll', onScroll, {passive:true});

let toastT;
function toast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),2800); }

render();
persistIfNew();
initStore();
})();
</script>

if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
